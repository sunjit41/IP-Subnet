name: Publish to Microsoft Store

on:
  push:
    branches: [ main ] # Triggers automatically when you push code updates to main

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Matches your modern Visual Studio 2026 project dependencies

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Project Dependencies
      run: dotnet restore IPSubnet.sln --runtime win-x64 /p:Platform=x64

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/setup-msstore-cli@v1

    - name: Build and Package App
      run: |
        msbuild IPSubnet.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false /p:RuntimeIdentifier=win-x64
        
    - name: Authenticate and Publish to Microsoft Store
      env:
        SUBMISSION_SECRET: ${{ secrets.AZURE_AD_SECRET }}
      working-directory: ./IPSubnetPack
      run: |
        # FIXED: Combined auth and publish parameters directly into a single line to guarantee the SellerID is never lost
        msstore publish --appId 9NTR4840KOR6 --inputDirectory ".\AppPackages" --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} --clientSecret $env:SUBMISSION_SECRET --sellerId ${{ secrets.SELLER_ID }}
