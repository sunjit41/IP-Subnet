name: Publish to Microsoft Store

on:
  push:
    branches: [ main ] # Triggers automatically when you push code updates to main

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Ensures the runner engine has the proper VS 2026 runtime assets

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # FIXED: Replaced legacy nuget restore with modern dotnet restore targeting your platform architectures
    - name: Restore Project Dependencies
      run: dotnet restore IPSubnet.sln --runtime win-x86

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/setup-msstore-cli@v1

    - name: Build and Package App
      run: |
        msbuild IPSubnet.sln /p:Configuration=Release /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageSigningEnabled=false /p:RuntimeIdentifier=win-x86

    - name: Authenticate and Publish to Microsoft Store
      env:
        SUBMISSION_SECRET: ${{ secrets.AZURE_AD_SECRET }}
      run: |
        msstore reconfigure --client-id ${{ secrets.AZURE_AD_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_AD_TENANT_ID }} --client-secret $env:SUBMISSION_SECRET
        msstore publish --package-path (Get-ChildItem -Path .\**\*_StoreUpload.msixupload, .\**\*_StoreUpload.appxupload | Select-Object -First 1).FullName
